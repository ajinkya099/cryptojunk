[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iga-ai-framework"
version = "0.1.0"
description = "IGA AI Framework — Identity Governance & Administration powered by AISm autonomous agents"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",       # PostgreSQL async driver
    "aiosqlite>=0.20.0",     # SQLite async driver (dev)
    # AI — Anthropic
    "anthropic>=0.30.0",
    # Task Queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
iga-api = "iga.main:run"
iga-worker = "iga.workers.tasks:run_worker"

[tool.hatch.build.targets.wheel]
packages = ["src/iga"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
